<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <title>Document</title>
    <link rel="stylesheet" href="./signin_signup.css" />
    <link rel="stylesheet" href="" />
  </head>
  <body>
    <main id="signup-view" class="page-view">
      <div class="form-view">
        <div class="form-logos">
          <img src="./img/logo.png" alt="Nike" />
          <img
            src="https://i.pinimg.com/736x/01/39/93/0139937c2f641ab61fd020844ccfd459.jpg"
            alt="Jordan"
          />
        </div>
        <h1>Now let's make you a Nike Member.</h1>
        

        <div class="input-wrapper">
          <input type="email" id="email" placeholder="Email*" />
          <i class="fa-solid fa-rotate-right input-icon"></i>
        </div>

        <div class="input-wrapper">
          <input type="text" id="full-name" placeholder="Full Name" />
        </div>

        <div class="input-wrapper">
          <input type="password" id="password" placeholder="Password*" />
          <i class="fa-regular fa-eye input-icon"></i>
        </div>
        <ul class="requirements">
          <li><i class="fa-solid fa-check"></i> Minimum of 8 characters</li>
          <li>
            <i class="fa-solid fa-check"></i> Uppercase, lowercase letters and
            one number
          </li>
        </ul>

        <div class="input-wrapper">
          <select>
            <option value="" disabled selected>Shopping Preference*</option>
            <option value="men">Men's</option>
            <option value="women">Women's</option>
          </select>
          <i class="fa-solid fa-chevron-down input-icon"></i>
        </div>

        <div class="input-wrapper">
          <input type="tel" id="phone" placeholder="Phone" />
        </div>

        <div class="input-wrapper">
          <input type="text" id="address" placeholder="Address" />
        </div>

        <div class="checkbox-group">
          <input type="checkbox" />
          <span
            >Sign up for emails to get updates from Nike on products, offers and
            your Member benefits.</span
          >
        </div>

        <div class="checkbox-group">
          <input type="checkbox" />
          <span
            >I agree to Nike's <a href="#">Privacy Policy</a> and
            <a href="#">Terms of Use</a>.</span
          >
        </div>
        <div class="form-actions">
          <button type="submit" id="btn-register" class="btn-black">Create Account
          </button>
        </div>
      </div>
    </main>
    <script src="../JavaScripts/auth.js"></script>
  </body>
</html>
