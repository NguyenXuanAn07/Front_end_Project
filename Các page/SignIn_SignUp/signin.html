<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignIn</title>
    <link rel="stylesheet" href="./signin_signup.css" />
  </head>
  <body>
    <main id="signin-view" class="page-view">
      <div class="signin-view">
        <div class="signin-logos">
          <img src="img/logotronnike.png" alt="Nike" />
          <img src="https://i.pinimg.com/736x/01/39/93/0139937c2f641ab61fd020844ccfd459.jpg" alt="Jordan" />
        </div>
        <h1>Enter your email to join us or sign in.</h1>
        <div class="location-info">Vietnam <a href="#" class="change-link">Change</a></div>
        <div class="input-group">
          <input type="email" placeholder="Email*" required />
        </div>
        <p class="legal-text">By continuing, I agree to Nike's <a href="#">Privacy Policy</a> and <a href="#">Terms of Use</a>.</p>
        <div class="signin-actions">
          <button class="btn-continue"><a href="signup.html">Continue</a></button>
        </div>
      </div>
    </main>
  </body>
</html>
