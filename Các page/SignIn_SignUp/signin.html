<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignIn</title>
    <link rel="stylesheet" href="./signin_signup.css" />
  </head>
  <body>
    <main id="signin-view" class="page-view">
      <div class="signin-view">
        <div class="signin-logos">
          <img src="img/logotronnike.png" alt="Nike" />
          <img
            src="https://i.pinimg.com/736x/01/39/93/0139937c2f641ab61fd020844ccfd459.jpg"
            alt="Jordan"
          />
        </div>
        <h1>Enter your email to sign in.</h1>
        <div class="location-info">
          Vietnam <a href="#" class="change-link">Change</a>
        </div>
        <div class="input-group">
          <input type="email" id="email" placeholder="Email*" required />
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder="Password*" required />
        </div>
        <p class="legal-text">
          By continuing, I agree to Nike's <a href="#">Privacy Policy</a> and
          <a href="#">Terms of Use</a>.
        </p>
        <div class="signin-actions">
          <button type="button" id="btn-login" class="btn-continue">
            Continue
          </button>
        </div>
      </div>
    </main>
    <script src="../JavaScripts/auth.js"></script>
  </body>
</html>
