<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Detail</title>
    <link rel="stylesheet" href="../head,foot/css/header.css" />
    <link rel="stylesheet" href="../head,foot/css/anouncement_bar.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="icon" href="../head,foot/img/logotronnike.png" />
    <style>
      * {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      .main-header {
        position: relative;
        top: auto;
      }

      /* Breadcrumb */
      .pdp-breadcrumb {
        padding: 16px 48px;
        font-size: 13px;
        color: #757575;
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }

      .pdp-breadcrumb a {
        color: #757575;
        text-decoration: none;
      }

      .pdp-breadcrumb a:hover {
        text-decoration: underline;
      }

      /* Main layout */
      .pdp-main {
        display: grid;
        grid-template-columns: 80px 1fr 480px;
        gap: 0 24px;
        padding: 0 48px 80px;
        max-width: 1400px;
        margin: 0 auto;
      }

      /* Thumbnail column */
      .pdp-thumbnails {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .pdp-thumb {
        width: 72px;
        height: 72px;
        background: #f5f5f5;
        cursor: pointer;
        overflow: hidden;
        border: 2px solid transparent;
        transition: border-color 0.15s;
        flex-shrink: 0;
      }

      .pdp-thumb.active {
        border-color: #111;
      }

      .pdp-thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .pdp-thumb:hover {
        border-color: #111;
      }

      /* Main image */
      .pdp-main-img {
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        aspect-ratio: 1 / 1;
        max-height: 620px;
      }

      .pdp-main-img img {
        width: 85%;
        object-fit: contain;
        transition: opacity 0.2s ease;
      }

      /* Nav arrows */
      .pdp-img-nav {
        position: absolute;
        bottom: 16px;
        display: flex;
        gap: 8px;
        right: 16px;
      }

      .pdp-img-nav button {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        transition: background 0.15s;
      }

      .pdp-img-nav button:hover {
        background: #fff;
      }

      /* Info panel */
      .pdp-info {
        padding: 0 0 0 16px;
      }

      .pdp-badge {
        font-size: 13px;
        font-weight: 600;
        color: #e00000;
        margin-bottom: 8px;
      }

      .pdp-name {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #111;
        margin-bottom: 4px;
      }

      .pdp-type {
        font-size: 16px;
        color: #757575;
        margin-bottom: 12px;
      }

      .pdp-price {
        font-size: 20px;
        font-weight: 500;
        color: #111;
        margin-bottom: 24px;
      }

      /* Size selector */
      .pdp-size-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .pdp-size-label {
        font-size: 18px;
        font-weight: 700;
      }

      .pdp-size-guide {
        font-size: 16px;
        font-weight: 500;
        color: #111;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        background: none;
        border: none;
      }

      .pdp-size-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 10px;
      }

      .pdp-size-option {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 400;
        color: #111;
        padding: 18px 4px;
        cursor: pointer;
        background: #fff;
        transition: border-color 0.15s;
        user-select: none;
      }

      .pdp-size-option:hover {
        border-color: #111;
      }

      .pdp-size-option.selected {
        border: 2px solid #111;
        font-weight: 700;
      }

      .pdp-size-fit-hint {
        font-size: 14px;
        color: #111;
        margin-bottom: 14px;
        line-height: 1.5;
      }

      .pdp-size-error {
        font-size: 13px;
        color: #e00000;
        margin-bottom: 12px;
        display: none;
      }

      .pdp-size-error.visible {
        display: block;
      }

      /* Buttons */
      .pdp-add-bag {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 18px;
        background: #111;
        color: #fff;
        font-size: 16px;
        font-weight: 500;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        margin-bottom: 12px;
        margin-top: 16px;
        transition: background 0.2s;
      }

      .pdp-add-bag:hover {
        background: #333;
      }

      .pdp-favourite {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 18px;
        background: #fff;
        color: #111;
        font-size: 16px;
        font-weight: 500;
        border: 1px solid #e5e5e5;
        border-radius: 30px;
        cursor: pointer;
        margin-bottom: 24px;
        transition: border-color 0.2s;
      }

      .pdp-favourite:hover {
        border-color: #111;
      }

      /* Description */
      .pdp-description {
        font-size: 16px;
        font-weight: 500;
        color: #111;
        line-height: 1.7;
        margin-bottom: 20px;
      }

      /* View Product Details link */
      .pdp-view-details-link {
        font-size: 16px;
        font-weight: 600;
        color: #111;
        text-decoration: underline;
        cursor: pointer;
        display: inline-block;
        margin-bottom: 24px;
        background: none;
        border: none;
        padding: 0;
      }

      .pdp-view-details-link:hover {
        color: #757575;
      }

      /* Product specs (hiển thị sẵn bên ngoài, phía trên "View Product Details") */
      .pdp-specs-panel {
        margin-bottom: 12px;
      }

      .pdp-specs {
        list-style: disc;
        padding-left: 20px;
      }

      .pdp-specs li {
        font-size: 16px;
        font-weight: 500;
        color: #111;
        line-height: 1.9;
      }

      /* Modal: View Product Details */
      .pdp-modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }

      .pdp-modal-overlay.open {
        display: flex;
      }

      .pdp-modal {
        background: #fff;
        border-radius: 8px;
        max-width: 640px;
        width: 90%;
        max-height: 85vh;
        overflow-y: auto;
        padding: 32px;
        position: relative;
      }

      .pdp-modal-close {
        position: absolute;
        top: 24px;
        right: 24px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        background: #f5f5f5;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
      }

      .pdp-modal-close:hover {
        background: #e5e5e5;
      }

      .pdp-modal-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        padding-right: 48px;
      }

      .pdp-modal-img {
        width: 64px;
        height: 64px;
        background: #f5f5f5;
        flex-shrink: 0;
      }

      .pdp-modal-img img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .pdp-modal-name {
        font-size: 17px;
        font-weight: 500;
        color: #111;
        margin-bottom: 4px;
      }

      .pdp-modal-price {
        font-size: 15px;
        color: #111;
      }

      .pdp-modal-desc {
        font-size: 15px;
        color: #111;
        line-height: 1.6;
        margin-bottom: 24px;
      }

      .pdp-modal-subtitle {
        font-size: 18px;
        font-weight: 700;
        color: #111;
        margin-bottom: 12px;
      }

      /* Accordion sections */
      .pdp-accordion {
        border-top: 1px solid #e5e5e5;
      }

      .pdp-accordion-item {
        border-bottom: 1px solid #e5e5e5;
      }

      .pdp-accordion-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 0;
        cursor: pointer;
        font-size: 18px;
        font-weight: 700;
        background: none;
        border: none;
        width: 100%;
        text-align: left;
      }

      .pdp-accordion-header:hover {
        opacity: 0.7;
      }

      /* Star rating in accordion */
      .pdp-stars {
        display: flex;
        gap: 3px;
        color: #ccc;
        font-size: 16px;
      }

      .pdp-accordion-header-inner {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .pdp-accordion-body {
        display: none;
        padding: 0 0 20px;
        font-size: 15px;
        font-weight: 400;
        color: #111;
        line-height: 1.7;
      }

      .pdp-accordion-body p {
        margin-bottom: 16px;
      }

      .pdp-accordion-body p:last-child {
        margin-bottom: 0;
      }

      .pdp-accordion-body a {
        color: #111;
      }

      .pdp-delivery-list {
        list-style: disc;
        padding-left: 20px;
        margin-bottom: 16px;
      }

      .pdp-delivery-list li {
        padding: 2px 0;
      }

      .pdp-review-summary {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }

      .pdp-review-summary .pdp-stars {
        font-size: 16px;
      }

      .pdp-write-review-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border: 1px solid #111;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 500;
        background: #fff;
        color: #111;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }

      .pdp-write-review-btn:hover {
        background: #111;
        color: #fff;
      }

      .pdp-accordion-body.open {
        display: block;
      }

      /* "How Others Are Wearing It" section */
      .pdp-ugc {
        padding: 48px 48px;
        max-width: 1400px;
        margin: 0 auto;
        border-top: 1px solid #e5e5e5;
      }

      .pdp-ugc h2 {
        font-size: 22px;
        font-weight: 700;
        color: #111;
        margin-bottom: 6px;
      }

      .pdp-ugc p {
        font-size: 14px;
        color: #757575;
        margin-bottom: 20px;
      }

      .pdp-ugc-upload-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border: 1px solid #111;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 500;
        background: #fff;
        color: #111;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }

      .pdp-ugc-upload-btn:hover {
        background: #111;
        color: #fff;
      }

      /* Related Products */
      .pdp-related {
        padding: 0 48px 80px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .pdp-related h2 {
        font-size: 22px;
        font-weight: 700;
        color: #111;
        margin-bottom: 20px;
      }

      .pdp-related-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }

      .pdp-related-card {
        cursor: pointer;
      }

      .pdp-related-card:hover .pdp-related-img img {
        transform: scale(1.03);
      }

      .pdp-related-img {
        background: #f5f5f5;
        overflow: hidden;
        margin-bottom: 10px;
      }

      .pdp-related-img img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: contain;
        display: block;
        transition: transform 0.3s ease;
      }

      .pdp-related-badge {
        font-size: 13px;
        font-weight: 600;
        color: #e00000;
        margin-bottom: 3px;
      }

      .pdp-related-name {
        font-size: 14px;
        font-weight: 600;
        color: #111;
        margin-bottom: 2px;
      }

      .pdp-related-type {
        font-size: 13px;
        color: #757575;
        margin-bottom: 2px;
      }

      .pdp-related-price {
        font-size: 14px;
        font-weight: 500;
        color: #111;
      }

      /* Not found */
      .pdp-not-found {
        padding: 80px 48px;
        text-align: center;
        font-size: 20px;
        color: #757575;
      }

      /* Toast notification */
      .pdp-toast {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #111;
        color: #fff;
        padding: 14px 28px;
        border-radius: 30px;
        font-size: 15px;
        font-weight: 500;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
        z-index: 9999;
        white-space: nowrap;
      }

      .pdp-toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <!-- 1. Top Header -->
    <header class="top-header">
      <div class="jordan-logo">
        <img src="../head,foot/img/JORDAN-removebg-preview.png" alt="" />
      </div>
      <div class="top-nav-links">
        <a href="#">Find a Store</a>
        <span>|</span>
        <a href="#">Help</a>
        <span>|</span>
        <a href="#">Join Us</a>
        <span>|</span>
        <a href="../SignIn_SignUp/signin.html">Sign In</a>
      </div>
    </header>

    <!-- 2. Main Header -->
    <header class="main-header">
      <a href="../index.html" class="nike-logo">
        <img src="../head,foot/img/logo.png" alt="" />
      </a>
      <nav class="nav-menu">
        <div class="nav-item"><a href="">New & Featured</a></div>
        <div class="nav-item"><a href="./men.html">Men</a></div>
        <div class="nav-item"><a href="../women.html">Women</a></div>
        <div class="nav-item"><a href="../kids-type.html">Kids</a></div>
        <div class="nav-item"><a href="">Nike Football</a></div>
        <div class="nav-item"><a href="../sale-type.html">Sale</a></div>
      </nav>
      <div class="header-right">
        <div class="search-container">
          <i class="fa fa-search"></i>
          <input type="text" placeholder="Search" />
        </div>
        <i class="fa-regular fa-heart icon-btn"></i>
        <i class="fa-regular fa-bag-shopping icon-btn"></i>
      </div>
    </header>

    <!-- 3. Announcement Bar -->
    <div class="announcement-bar">
      <p>Free Standard Delivery &amp; 30-Day Free Returns <a href="#">Join Now</a> <a href="#">View Details</a></p>
    </div>

    <!-- 4. Breadcrumb -->
    <nav class="pdp-breadcrumb" id="pdp-breadcrumb"></nav>

    <!-- 5. PDP Content -->
    <main id="pdp-content"></main>

    <!-- 6. How Others Are Wearing It -->
    <section class="pdp-ugc" id="pdp-ugc" style="display: none">
      <h2>How Others Are Wearing It</h2>
      <p>Upload your photo or mention @Nike on Instagram for a chance to be featured.</p>
      <button class="pdp-ugc-upload-btn"><i class="fa-regular fa-image"></i> Upload Your Photo</button>
    </section>

    <!-- 7. Related Products -->
    <section class="pdp-related" id="pdp-related" style="display: none">
      <h2>You Might Also Like</h2>
      <div class="pdp-related-grid" id="pdp-related-grid"></div>
    </section>

    <!-- Toast -->
    <div class="pdp-toast" id="pdp-toast"></div>

    <script src="./products.js"></script>
    <script>
      (function () {
        /* ── Helpers ── */
        function formatPrice(value) {
          return value.toLocaleString("vi-VN") + "₫";
        }

        function getProductIdFromUrl() {
          return new URLSearchParams(window.location.search).get("id");
        }

        function showToast(msg) {
          const toast = document.getElementById("pdp-toast");
          toast.textContent = msg;
          toast.classList.add("show");
          setTimeout(() => toast.classList.remove("show"), 2500);
        }

        /* ── Not found ── */
        function renderNotFound() {
          document.getElementById("pdp-content").innerHTML = `
            <div class="pdp-not-found">
              <p>Không tìm thấy sản phẩm.</p>
              <a href="./men-shoes.html" style="color:#111;text-decoration:underline;margin-top:12px;display:inline-block;">← Quay lại Men's Shoes</a>
            </div>`;
        }

        /* ── Breadcrumb ── */
        function renderBreadcrumb(product) {
          document.getElementById("pdp-breadcrumb").innerHTML = `
            <a href="../index.html">Trang chủ</a>
            <span>›</span>
            <a href="./men-shoes.html">Men's Shoes</a>
            <span>›</span>
            <span style="color:#111">${product.name}</span>`;
        }

        /* ── Related Products ── */
        function renderRelated(currentProduct) {
          const related = PRODUCTS.filter((p) => p.id !== currentProduct.id && (p.sport === currentProduct.sport || p.gender === currentProduct.gender)).slice(0, 4);

          if (related.length === 0) return;

          const grid = document.getElementById("pdp-related-grid");
          grid.innerHTML = related
            .map(
              (p) => `
            <div class="pdp-related-card" data-id="${p.id}">
              <div class="pdp-related-img">
                <img src="${p.img}" alt="${p.name}" loading="lazy" />
              </div>
              ${p.badge ? `<p class="pdp-related-badge">${p.badge}</p>` : ""}
              <p class="pdp-related-name">${p.name}</p>
              <p class="pdp-related-type">${p.type}</p>
              <p class="pdp-related-price">${formatPrice(p.price)}</p>
            </div>
          `,
            )
            .join("");

          grid.querySelectorAll(".pdp-related-card").forEach((card) => {
            card.addEventListener("click", () => {
              window.location.href = `./product-detail.html?id=${card.dataset.id}`;
            });
          });

          document.getElementById("pdp-related").style.display = "block";
        }

        /* ── Main PDP render ── */
        function renderPDP(product) {
          document.title = product.name + " – Nike";
          renderBreadcrumb(product);

          // Build multiple "fake" thumbnail angles from single img
          // In a real project each product would have multiple img URLs
          const thumbImgs = product.images && product.images.length > 0 ? product.images : [product.img];
          let currentImgIndex = 0;

          const badgeHtml = product.badge ? `<p class="pdp-badge">${product.badge}</p>` : "";

          const isShoeSize = (s) => /^\d+(\.\d+)?$/.test(s);
          const sizeOptionsHtml = (product.sizes || []).map((s) => `<div class="pdp-size-option" data-size="${s}">${isShoeSize(s) ? "EU " + s : s}</div>`).join("");

          document.getElementById("pdp-content").innerHTML = `
            <div class="pdp-main">
              <!-- Thumbnails -->
              <div class="pdp-thumbnails" id="pdp-thumbnails">
                ${thumbImgs
                  .map(
                    (img, i) => `
                  <div class="pdp-thumb ${i === 0 ? "active" : ""}" data-index="${i}">
                    <img src="${img}" alt="${product.name} view ${i + 1}" loading="lazy" />
                  </div>
                `,
                  )
                  .join("")}
              </div>

              <!-- Main Image -->
              <div class="pdp-main-img">
                <img src="${product.img}" alt="${product.name}" id="pdp-hero-img" />
                <div class="pdp-img-nav">
                  <button id="img-prev" aria-label="Previous image"><i class="fa-solid fa-chevron-left"></i></button>
                  <button id="img-next" aria-label="Next image"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
              </div>

              <!-- Info Panel -->
              <div class="pdp-info">
                ${badgeHtml}
                <h1 class="pdp-name">${product.name}</h1>
                <p class="pdp-type">${product.type}</p>
                <p class="pdp-price">${formatPrice(product.price)}</p>

                <div class="pdp-size-header">
                  <span class="pdp-size-label">Select Size</span>
                  <button class="pdp-size-guide">
                    <i class="fa-regular fa-ruler"></i> Size Guide
                  </button>
                </div>
                <p class="pdp-size-fit-hint">Snug fit; if you prefer a slightly looser fit, we recommend ordering half a size up</p>
                <div class="pdp-size-grid" id="pdp-size-grid">
                  ${sizeOptionsHtml}
                </div>
                <p class="pdp-size-error" id="pdp-size-error">Vui lòng chọn size.</p>

                <button class="pdp-add-bag" id="pdp-add-bag">Add to Bag</button>
                <button class="pdp-favourite" id="pdp-fav">
                  Favourite <i class="fa-regular fa-heart"></i>
                </button>

                <p class="pdp-description">${product.description || ""}</p>

                <div class="pdp-specs-panel">
                  <ul class="pdp-specs">
                    ${product.colorName ? `<li>Colour Shown: ${product.colorName}</li>` : ""}
                    ${product.styleCode ? `<li>Style: ${product.styleCode}</li>` : ""}
                    ${product.origin ? `<li>Country/Region of Origin: ${product.origin}</li>` : ""}
                  </ul>
                </div>

                <button class="pdp-view-details-link" id="pdp-view-details-btn">View Product Details</button>

                <div class="pdp-accordion">
                  <div class="pdp-accordion-item">
                    <button class="pdp-accordion-header" id="acc-delivery">
                      <span>Free Delivery and Returns</span>
                      <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="pdp-accordion-body" id="acc-delivery-body">
                      <p>Your order of ${formatPrice(5000000)} or more gets free standard delivery.</p>
                      <ul class="pdp-delivery-list">
                        <li>Standard delivered 4-5 Business Days</li>
                        <li>Express delivered 2-4 Business Days</li>
                      </ul>
                      <p>Orders are processed and delivered Monday-Friday (excluding public holidays)</p>
                      <p>Nike Members enjoy <a href="#">free returns</a>.</p>
                    </div>
                  </div>
                  <div class="pdp-accordion-item">
                    <button class="pdp-accordion-header" id="acc-reviews">
                      <div class="pdp-accordion-header-inner">
                        <span>Reviews (0)</span>
                        <div class="pdp-stars">
                          <i class="fa-regular fa-star"></i>
                          <i class="fa-regular fa-star"></i>
                          <i class="fa-regular fa-star"></i>
                          <i class="fa-regular fa-star"></i>
                          <i class="fa-regular fa-star"></i>
                        </div>
                      </div>
                      <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="pdp-accordion-body" id="acc-reviews-body">
                      <div class="pdp-review-summary">
                        <div class="pdp-stars">
                          <i class="fa-regular fa-star"></i>
                          <i class="fa-regular fa-star"></i>
                          <i class="fa-regular fa-star"></i>
                          <i class="fa-regular fa-star"></i>
                          <i class="fa-regular fa-star"></i>
                        </div>
                        <span>No reviews</span>
                      </div>
                      <p>Have your say. Be the first to review the ${product.name}.</p>
                      <button class="pdp-write-review-btn" id="pdp-write-review-btn">Write a review</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- View Product Details Modal -->
            <div class="pdp-modal-overlay" id="pdp-modal-overlay">
              <div class="pdp-modal">
                <button class="pdp-modal-close" id="pdp-modal-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
                <div class="pdp-modal-header">
                  <div class="pdp-modal-img">
                    <img src="${product.img}" alt="${product.name}" />
                  </div>
                  <div>
                    <p class="pdp-modal-name">${product.name}</p>
                    <p class="pdp-modal-price">${formatPrice(product.price)}</p>
                  </div>
                </div>
                <p class="pdp-modal-desc">${product.description || ""}</p>
                <p class="pdp-modal-subtitle">Product details</p>
                <ul class="pdp-specs">
                  ${product.colorName ? `<li>Colour Shown: ${product.colorName}</li>` : ""}
                  ${product.styleCode ? `<li>Style: ${product.styleCode}</li>` : ""}
                  ${product.origin ? `<li>Country/Region of Origin: ${product.origin}</li>` : ""}
                </ul>
              </div>
            </div>`;

          /* ── Thumbnail navigation ── */
          const thumbEls = document.querySelectorAll(".pdp-thumb");
          const heroImg = document.getElementById("pdp-hero-img");

          function setActiveThumb(index) {
            currentImgIndex = index;
            thumbEls.forEach((t) => t.classList.remove("active"));
            thumbEls[index].classList.add("active");
            heroImg.style.opacity = "0";
            setTimeout(() => {
              heroImg.src = thumbImgs[index];
              heroImg.style.opacity = "1";
            }, 150);
          }

          thumbEls.forEach((thumb, i) => {
            thumb.addEventListener("click", () => setActiveThumb(i));
          });

          document.getElementById("img-prev").addEventListener("click", () => {
            setActiveThumb((currentImgIndex - 1 + thumbImgs.length) % thumbImgs.length);
          });

          document.getElementById("img-next").addEventListener("click", () => {
            setActiveThumb((currentImgIndex + 1) % thumbImgs.length);
          });

          /* ── Size selection ── */
          document
            .getElementById("pdp-size-grid")
            .querySelectorAll(".pdp-size-option")
            .forEach((el) => {
              el.addEventListener("click", () => {
                document.querySelectorAll(".pdp-size-option").forEach((s) => s.classList.remove("selected"));
                el.classList.add("selected");
                document.getElementById("pdp-size-error").classList.remove("visible");
              });
            });

          /* ── Add to Bag ── */
          document.getElementById("pdp-add-bag").addEventListener("click", async () => {
            const selected = document.querySelector(".pdp-size-option.selected");
            if (!selected) {
              document.getElementById("pdp-size-error").classList.add("visible");
              document.getElementById("pdp-size-grid").scrollIntoView({ behavior: "smooth", block: "center" });
              return;
            }
            const token = localStorage.getItem("token");
            if (!token) {
              alert("Bạn cần đăng nhập trước!");
              window.location.href = "../SignIn_SignUp/signin.html";
              return;
            }
            const dbId = parseInt(product.id.replace(/\D/g, ""), 10);
            const response = await fetch("http://127.0.0.1:8000/cart/add", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + token,
              },
              body: JSON.stringify({ product_id: dbId, quantity: 1 }),
            });
            const data = await response.json();
            if (response.ok) {
              const cartProducts = JSON.parse(localStorage.getItem("cart_products") || "{}");
              cartProducts[dbId] = { product_name: product.name, price: product.price, image_url: product.img || "" };
              localStorage.setItem("cart_products", JSON.stringify(cartProducts));
              alert("Đã thêm vào giỏ hàng!");
            } else {
              alert(data.detail || "Thêm vào giỏ hàng thất bại!");
            }
          });

          /* ── Favourite toggle ── */
          const favBtn = document.getElementById("pdp-fav");
          let isFav = false;
          favBtn.addEventListener("click", () => {
            isFav = !isFav;
            const icon = favBtn.querySelector("i");
            icon.className = isFav ? "fa-solid fa-heart" : "fa-regular fa-heart";
            icon.style.color = isFav ? "#e00000" : "";
            showToast(isFav ? `♡ Đã thêm vào Favourites` : `Đã xoá khỏi Favourites`);
          });

          /* ── View Product Details modal ── */
          const detailsBtn = document.getElementById("pdp-view-details-btn");
          const modalOverlay = document.getElementById("pdp-modal-overlay");
          const modalClose = document.getElementById("pdp-modal-close");

          detailsBtn.addEventListener("click", () => {
            modalOverlay.classList.add("open");
          });

          modalClose.addEventListener("click", () => {
            modalOverlay.classList.remove("open");
          });

          modalOverlay.addEventListener("click", (e) => {
            if (e.target === modalOverlay) {
              modalOverlay.classList.remove("open");
            }
          });

          /* ── Accordion ── */
          ["acc-delivery", "acc-reviews"].forEach((id) => {
            const header = document.getElementById(id);
            const body = document.getElementById(id + "-body");
            header.addEventListener("click", () => {
              const isOpen = body.classList.toggle("open");
              header.querySelector("i.fa-chevron-down, i.fa-chevron-up").className = isOpen ? "fa-solid fa-chevron-up" : "fa-solid fa-chevron-down";
            });
          });
        }

        /* ── Init ── */
        const id = getProductIdFromUrl();
        const product = typeof PRODUCTS !== "undefined" && PRODUCTS.find((p) => p.id === id);

        if (!product) {
          renderNotFound();
        } else {
          renderPDP(product);
          document.getElementById("pdp-ugc").style.display = "block";
          renderRelated(product);
        }
      })();
    </script>
    <script src="../JavaScripts/cart.js"></script>
  </body>
</html>
