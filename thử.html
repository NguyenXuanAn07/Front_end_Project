<style>
/* Ẩn checkbox */
#toggle-tech {
  display: none;
}

/* Ẩn list mặc định */
.menu-of-list-slider {
  display: none;
  list-style: none;
  margin: 0;
  padding: 0;
}

/* Khi checkbox được tick thì hiện list */
#toggle-tech:checked + .menu-of-list-slider {
  display: block;
}
</style>

<!-- Checkbox ẩn để điều khiển -->
<input type="checkbox" id="toggle-tech">

<!-- Label đóng vai trò nút bấm -->
<label for="toggle-tech">Technology</label>

<ul class="menu-of-list-slider">
    <li><input type="radio">Nike ReactX</li>
    <li><input type="radio">Nike EasyOn</li>
    <li><input type="radio">Nike FlyEase</li>
    <li><input type="radio">All Conditions Control</li>
    <li><a href="#">+ More</a></li>
</ul>
